@if (showOrientationWarning()) {
  <div class="orientation-warning">
    <div class="orientation-warning-content">
      <div class="orientation-icon"></div>
      <h2>Gire seu dispositivo</h2>
      <p>Por favor, vire seu dispositivo para o modo horizontal para uma melhor experiência.</p>
    </div>
  </div>
}

<header>
  <button class="music-toggle" (click)="musicService.toggleMute()" [class.is-muted]="musicService.isMuted()" [attr.aria-label]="musicService.isMuted() ? 'Ativar som' : 'Desativar som'">
    <div class="speaker-icon">
      <div class="speaker-base"></div>
      <div class="speaker-wave"></div>
    </div>
  </button>

  <div id="container-title">
    <img src="images/pokeball.png" alt="imagem de pokebola">
    <h2>Pokehub</h2>
    <img src="images/pokeball.png" alt="imagem de pokebola">
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer>
  <div class="footer-content">
    <div class="footer-left">
      <a id="github-link" href="https://github.com/alanzink1/pokehub-angular" target="_blank">
        <img src="images/github.png" alt="ícone do github">
        <p>Alanzink1</p>
      </a>
    </div>
    <div class="footer-center">
    </div>
    <div class="footer-right">
    </div>
  </div>
</footer>
