<div class="container-info" [class.overlay]="opened()" [class.appear]="pokemon() !== null" [class.show]="opened()"
  (click)="toggleTable()">

  <div class="pokedex-body">
    <div class="header-pokedex">
      <div class="blue-light"></div>
      <div class="lights">
        <div class="red-light"></div>
        <div class="yellow-light"></div>
        <div class="green-light"></div>
      </div>
      <span class="pkmn-id">No. {{ pokemon()?.id }}</span>
    </div>

    <div class="screen-area">
      <div class="screen-header">
        <h2 class="pkmn-name">{{ pokemon()?.name }}</h2>
        <div class="type-badges">
          @for (type of types(); track type.type.name) {
          <span class="type-tag" [class]="type.type.name">{{ type.type.name }}</span>
          }
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <label>ALTURA</label>
          <span>{{ heightM() }}m</span>
        </div>
        <div class="stat-item">
          <label>PESO</label>
          <span>{{ weightKg() }}kg</span>
        </div>
      </div>

      <div class="moves-section">
        <label class="section-label">MOVIMENTOS</label>
        <div class="moves-list">
          @for (move of moves(); track move) {
          <span class="move-tag">{{ move }}</span>
          }
        </div>
      </div>

      <div class="description-box">
        <p>{{ flavorText() }}</p>
      </div>
    </div>

    <div class="close-hint">CLIQUE PARA FECHAR</div>
  </div>
</div>
